<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | ResuFit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #F0F4F9;
            --surface: #FFFFFF;
            --text-primary: #1F1F1F;
            --text-secondary: #444746;
            --primary: #0B57D0;
            --primary-container: #D3E3FD;
            --ai-gradient: linear-gradient(90deg, #4285f4 0%, #9b72cb 50%, #d96570 100%);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            background-color: var(--surface);
            border-radius: var(--radius);
            padding: 40px 32px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .icon-container {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary-container);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 24px;
            animation: pulse 2s infinite ease-in-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--ai-gradient);
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            padding: 14px 32px;
            border-radius: 100px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(11, 87, 208, 0.2);
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(11, 87, 208, 0.3);
        }

        .btn-retry:active {
            transform: translateY(0);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.9;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-container">
            <i class="fa-solid fa-wifi-slash"></i>
        </div>
        <h1>Connection Lost</h1>
        <p>It looks like you are currently offline. ResuFit's AI features require an internet connection, but you can retry once you are back online.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            <i class="fa-solid fa-rotate-right"></i> Retry Connection
        </button>
    </div>
</body>
</html>
