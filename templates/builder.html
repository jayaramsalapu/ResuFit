<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Build Resume | Resufit</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap"
          rel="stylesheet">

    <style>

        :root{

            --bg:#F0F4F9;
            --card:#ffffff;
            --text:#111827;
            --muted:#6b7280;
            --primary:#2563eb;
            --border:#E3E3E3;

            --gradient:
            linear-gradient(
            90deg,
            #4285f4 0%,
            #9b72cb 50%,
            #d96570 100%);
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            background:var(--bg);

            font-family:'DM Sans',sans-serif;

            color:var(--text);
        }

        /* NAVBAR */

        .navbar{

            position:fixed;

            top:0;

            left:0;

            right:0;

            z-index:100;

            display:flex;

            justify-content:space-between;

            align-items:center;

            padding:22px 48px;

            background:
            rgba(255,255,255,0.95);

            backdrop-filter:blur(20px);

            border-bottom:
            1px solid rgba(0,0,0,0.05);
        }

        .logo{

            text-decoration:none;

            font-size:1.3rem;

            font-weight:800;

            color:var(--text);
        }

        .nav-right{

            display:flex;

            gap:18px;
        }

        .btn-nav{

            text-decoration:none;

            color:var(--text);

            padding:10px 18px;

            border-radius:12px;

            border:1px solid var(--border);

            background:white;

            font-weight:600;

            transition:0.3s ease;
        }

        .btn-nav:hover{

            transform:translateY(-2px);
        }

        /* MAIN */

        .main-container{

            max-width:1300px;

            margin:auto;

            padding:
            150px 24px 80px;
        }

        /* HEADER */

        .header-section{

            text-align:center;

            margin-bottom:55px;
        }

        .header-section h1{

            font-size:3.2rem;

            font-weight:800;

            margin-bottom:18px;
        }

        .gradient-text{

            background:var(--gradient);

            -webkit-background-clip:text;

            -webkit-text-fill-color:transparent;
        }

        .header-section p{

            font-size:1.1rem;

            color:var(--muted);
        }

        /* TEMPLATE GRID */

        .template-grid{

            display:grid;

            grid-template-columns:
            repeat(3,1fr);

            gap:24px;

            margin-bottom:50px;
        }

        .template-card{

            background:white;

            border-radius:24px;

            overflow:hidden;

            border:2px solid transparent;

            cursor:pointer;

            transition:0.35s ease;

            padding:14px;
        }

        .template-card:hover{

            transform:translateY(-6px);

            box-shadow:
            0 25px 50px rgba(0,0,0,0.08);
        }

        .template-card img{

            width:100%;

            height:500px;

            object-fit:cover;

            border-radius:18px;
        }

        .template-card span{

            display:block;

            text-align:center;

            margin-top:14px;

            font-weight:700;
        }

        .template-card input{

            display:none;
        }

        .template-card:has(input:checked){

            border:2px solid var(--primary);

            box-shadow:
            0 20px 45px rgba(37,99,235,0.18);
        }

        /* FORM CARD */

        .resume-form{

            background:white;

            border-radius:32px;

            padding:50px;

            box-shadow:
            0 10px 30px rgba(0,0,0,0.05);
        }

        .section{

            margin-bottom:45px;
        }

        .section h2{

            font-size:1.6rem;

            margin-bottom:22px;

            color:var(--primary);
        }

        .grid{

            display:grid;

            grid-template-columns:
            repeat(2,1fr);

            gap:22px;
        }

        .input-group{

            display:flex;

            flex-direction:column;
        }

        .input-group label{

            font-weight:600;

            margin-bottom:10px;

            color:#374151;
        }

        .input-group input,

        .input-group textarea{

            padding:16px;

            border-radius:16px;

            border:1px solid var(--border);

            outline:none;

            font-size:15px;

            transition:0.3s ease;
        }

        .input-group textarea{

            resize:none;

            min-height:120px;
        }

        .input-group input:focus,

        .input-group textarea:focus{

            border-color:var(--primary);

            box-shadow:
            0 0 0 4px rgba(37,99,235,0.1);
        }

        .full{

            grid-column:1/-1;
        }

        /* BUTTON */

        .btn-submit{

            width:100%;

            border:none;

            padding:20px;

            border-radius:18px;

            background:
            linear-gradient(
            135deg,
            #2563eb,
            #7c3aed);

            color:white;

            font-size:1rem;

            font-weight:700;

            cursor:pointer;

            transition:0.35s ease;

            box-shadow:
            0 20px 45px rgba(124,58,237,0.25);
        }

        .btn-submit:hover{

            transform:
            translateY(-3px)
            scale(1.01);
        }

        /* MOBILE */

        @media(max-width:900px){

            .template-grid{

                grid-template-columns:1fr;
            }

            .grid{

                grid-template-columns:1fr;
            }

            .header-section h1{

                font-size:2.5rem;
            }
        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <a href="/dashboard"
           class="logo">

            Resufit

        </a>

        <div class="nav-right">

            <a href="/dashboard"
               class="btn-nav">

                Dashboard

            </a>

            <a href="/logout"
               class="btn-nav">

                Logout

            </a>

        </div>

    </nav>

    <!-- MAIN -->

    <div class="main-container">

        <!-- HEADER -->

        <div class="header-section">

            <h1>

                Build Your

                <span class="gradient-text">

                    Resume

                </span>

            </h1>

            <p>

                Choose template and fill your professional details.

            </p>

        </div>

        <!-- FORM -->

        <form action="/generate_resume"
              method="POST">

            <!-- TEMPLATE GRID -->

            <div class="template-grid">

                <label class="template-card">

                    <input type="radio"
                           name="template"
                           value="minimal"
                           checked>

                    <img src="/static/templates/minimal.png">

                    <span>Minimal</span>

                </label>

                <label class="template-card">

                    <input type="radio"
                           name="template"
                           value="simple">

                    <img src="/static/templates/simple.png">

                    <span>Modern</span>

                </label>

                <label class="template-card">

                    <input type="radio"
                           name="template"
                           value="professional">

                    <img src="/static/templates/professional.png">

                    <span>Professional</span>

                </label>

            </div>

            <!-- FORM CARD -->

            <div class="resume-form">

                <!-- PERSONAL -->

                <div class="section">

                    <h2>Personal Information</h2>

                    <div class="grid">

                        <div class="input-group">

                            <label>Full Name</label>

                            <input type="text"
                                   name="name">

                        </div>

                        <div class="input-group">

                            <label>Email</label>

                            <input type="email"
                                   name="email">

                        </div>

                        <div class="input-group">

                            <label>Phone</label>

                            <input type="text"
                                   name="phone">

                        </div>

                        <div class="input-group">

                            <label>LinkedIn</label>

                            <input type="text"
                                   name="linkedin">

                        </div>

                        <div class="input-group">

                            <label>GitHub</label>

                            <input type="text"
                                   name="github">

                        </div>

                        <div class="input-group">

                            <label>Portfolio</label>

                            <input type="text"
                                   name="portfolio">

                        </div>

                    </div>

                </div>

                <!-- SUMMARY -->

                <div class="section">

                    <h2>Professional Summary</h2>

                    <div class="input-group">

                        <textarea name="summary"></textarea>

                    </div>

                </div>

                <!-- SKILLS -->

                <div class="section">

                    <h2>Skills</h2>

                    <div class="input-group">

                        <textarea
                        name="skills"
                        placeholder="Python, Flask, React"></textarea>

                    </div>

                </div>

                <!-- EXPERIENCE -->

                <div class="section">

                    <h2>Experience</h2>

                    <div class="grid">

                        <div class="input-group">

                            <label>Role</label>

                            <input type="text"
                                   name="role">

                        </div>

                        <div class="input-group">

                            <label>Company</label>

                            <input type="text"
                                   name="company">

                        </div>

                        <div class="input-group full">

                            <label>Duration</label>

                            <input type="text"
                                   name="duration">

                        </div>

                        <div class="input-group full">

                            <label>Description</label>

                            <textarea
                            name="experience_description"></textarea>

                        </div>

                    </div>

                </div>

                <!-- PROJECT -->

                <div class="section">

                    <h2>Projects</h2>

                    <div class="grid">

                        <div class="input-group">

                            <label>Project Title</label>

                            <input type="text"
                                   name="project_title">

                        </div>

                        <div class="input-group">

                            <label>Technologies</label>

                            <input type="text"
                                   name="technologies">

                        </div>

                        <div class="input-group full">

                            <label>Description</label>

                            <textarea
                            name="project_description"></textarea>

                        </div>

                    </div>

                </div>

                <!-- EDUCATION -->

                <div class="section">

                    <h2>Education</h2>

                    <div class="grid">

                        <div class="input-group">

                            <label>Degree</label>

                            <input type="text"
                                   name="degree">

                        </div>

                        <div class="input-group">

                            <label>Institution</label>

                            <input type="text"
                                   name="institution">

                        </div>

                        <div class="input-group full">

                            <label>Year</label>

                            <input type="text"
                                   name="year">

                        </div>

                    </div>

                </div>

                <!-- CERTIFICATIONS -->

                <div class="section">

                    <h2>Certifications</h2>

                    <div class="input-group">

                        <textarea
                        name="certifications"></textarea>

                    </div>

                </div>

                <!-- BUTTON -->

                <button type="submit"
                        class="btn-submit">

                    Generate Resume

                </button>

            </div>

        </form>

    </div>

</body>

</html>
